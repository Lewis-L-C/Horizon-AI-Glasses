plugins {
    alias(libs.plugins.android.application)
    alias(libs.plugins.kotlin.android)
    id 'kotlin-kapt'
    id 'org.greenrobot.greendao'
}

// ============================================
// Secrets — read from local.properties (never committed to VCS).
// Injected as BuildConfig fields and the AMap manifest placeholder.
// Template: see local.properties.example at the repo root.
// ============================================
def secretProps = new Properties()
def secretPropsFile = rootProject.file('local.properties')
if (secretPropsFile.exists()) {
    secretProps.load(secretPropsFile.newInputStream())
}
def deepseekApiKey    = secretProps.getProperty('DEEPSEEK_API_KEY', '')
def glmApiKey         = secretProps.getProperty('GLM_API_KEY', '')
def amapApiKey        = secretProps.getProperty('AMAP_API_KEY', '')
def rokidClientSecret = secretProps.getProperty('ROKID_CLIENT_SECRET', '')

android {
    namespace 'com.blue.armobile'
    compileSdk 36

    defaultConfig {
        applicationId "com.blue.armobile"
        minSdk 28
        targetSdk 33
        versionCode 2
        versionName "1.0.1"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        // API keys injected from local.properties (empty placeholders if unset)
        buildConfigField "String", "DEEPSEEK_API_KEY", "\"$deepseekApiKey\""
        buildConfigField "String", "GLM_API_KEY", "\"$glmApiKey\""
        buildConfigField "String", "AMAP_API_KEY", "\"$amapApiKey\""
        buildConfigField "String", "ROKID_CLIENT_SECRET", "\"$rokidClientSecret\""
        manifestPlaceholders = [amap_api_key: amapApiKey]

        ndk {
            abiFilters 'arm64-v8a'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
    kotlinOptions {
        jvmTarget = '11'
    }

    buildFeatures {
        viewBinding true
        dataBinding true
        buildConfig true
    }

    sourceSets {
        main {
            jniLibs.srcDirs = ['jniLibs']
        }
    }
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar', '*.aar'])
    implementation libs.androidx.core.ktx
    implementation libs.androidx.appcompat
    implementation libs.material
    testImplementation libs.junit
    androidTestImplementation libs.androidx.junit
    androidTestImplementation libs.androidx.espresso.core
    implementation libs.androidx.fragment.ktx
    implementation libs.androidx.activity.ktx
    implementation libs.androidx.lifecycle.viewmodel.ktx

    // eventbus
    implementation libs.eventbus
    implementation libs.rokid.cxr.m
    implementation(libs.retrofit)
    implementation(libs.converter.gson)
    implementation(libs.okhttp)
    implementation(libs.kotlin.stdlib)
    implementation(libs.okio)
    implementation(libs.gson)
    implementation(libs.logging.interceptor)
    implementation libs.greendao
    // 动画库
    implementation libs.library

    // util库
    implementation 'com.blankj:utilcodex:1.31.1'

    // Retrofit网络通信库
    api 'com.squareup.retrofit2:retrofit:2.9.0'
    api 'com.squareup.retrofit2:converter-gson:2.9.0'
    api 'com.squareup.retrofit2:adapter-rxjava3:2.9.0'
    // rxjava
    implementation 'io.reactivex.rxjava3:rxandroid:3.0.0'
    implementation 'io.reactivex.rxjava3:rxjava:3.0.0'
    // glide
    implementation libs.glide

    // ============================================
    // CameraX - 摄像头预览
    // ============================================
    implementation "androidx.camera:camera-core:1.4.0"
    implementation "androidx.camera:camera-camera2:1.4.0"
    implementation "androidx.camera:camera-lifecycle:1.4.0"
    implementation "androidx.camera:camera-view:1.4.0"

    // ============================================
    // Google ML Kit OCR - 中文文字识别
    // ============================================
    implementation "com.google.mlkit:text-recognition-chinese:16.0.0"

    // ============================================
    // ✅ Google ML Kit 二维码扫描 (新增)
    // ============================================
    implementation "com.google.mlkit:barcode-scanning:17.2.0"

    // ============================================
    // OkHttp - 网络请求
    // ============================================
    implementation "com.squareup.okhttp3:okhttp:4.12.0"

    // ============================================
    // Gson - JSON 解析
    // ============================================
    implementation "com.google.code.gson:gson:2.11.0"

    // ============================================
    // Coroutine - 协程
    // ============================================
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.9.0"

    // ============================================
    // Vosk - 离线语音识别
    // ============================================
    implementation group: 'com.alphacephei', name: 'vosk-android', version: '0.3.32+'
    implementation 'net.java.dev.jna:jna:5.13.0@aar'

    // ============================================
    // WebRTC - 音频降噪
    // ============================================
    implementation 'org.webrtc:google-webrtc:1.0.32006'

    // ============================================
    // ✅ 高德地图 SDK（旧版 AAR，包含资源）
    // ============================================
    implementation files('src/main/assets/maps/AMap3DMap_11.2.000_AMapSearch_9.8.0_AMapLocation_11.2.000_20260603.aar')

    // ============================================
    // ✅ TensorFlow Lite - 红绿灯识别
    // ============================================
    implementation 'org.tensorflow:tensorflow-lite:2.14.0'
    implementation 'org.tensorflow:tensorflow-lite-gpu:2.14.0'
}

greendao {
    schemaVersion 1
    daoPackage 'com.blue.glassesapp.core.db.dao'
    targetGenDir 'src/main/java'
}

tasks.withType(org.jetbrains.kotlin.gradle.internal.KaptGenerateStubsTask).configureEach {
    dependsOn(":app:greendao")
}